workflows:
  android-debug:
    name: AlgebrAventura APK Debug
    max_build_duration: 30
    environment:
      java: 1.8
    scripts:
      - name: Preparar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-29" "build-tools;29.0.3"
      - name: Dar permisos a Gradle
        script: chmod +x gradlew
      - name: Compilar APK
        script: ./gradlew --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/*.txt
