workflows:
  android-debug:
    name: AlgebrAventura APK Debug
    max_build_duration: 30
    environment:
      xcode: 26.5
      java: 1.8
    scripts:
      - name: Configurar Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platforms/android-29"
          test -d "$ANDROID_SDK_ROOT/build-tools/29.0.3"
      - name: Dar permisos a Gradle
        script: |
          chmod +x gradlew
      - name: Verificar Gradle
        script: |
          ./gradlew --no-daemon --version
      - name: Compilar APK
        script: |
          ./gradlew --no-daemon clean assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/logs/*.txt
